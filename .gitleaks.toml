title = "SecureCI Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
paths = [
    '''node_modules''',
    '''\.venv''',
    '''venv''',
    '''\.git''',
    '''__pycache__'''
]

[[rules]]
id = "secureci-demo-secret"

description = "SecureCI demonstration secret"

regex = '''SECURECI_DEMO_SECRET_[A-Za-z0-9]+'''

keywords = [
    "SECURECI_DEMO_SECRET_"
]
